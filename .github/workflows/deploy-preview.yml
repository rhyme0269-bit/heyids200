name: Deploy Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# URLs are auto-detected from github context.
# Set CUSTOM_DOMAIN in repo Variables to use a custom domain.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive URLs
        id: urls
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "base_path=" >> $GITHUB_OUTPUT
            echo "site_url=https://${{ vars.CUSTOM_DOMAIN }}" >> $GITHUB_OUTPUT
          else
            echo "base_path=/${REPO_NAME}" >> $GITHUB_OUTPUT
            echo "site_url=https://${OWNER}.github.io/${REPO_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.urls.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.urls.outputs.site_url }}
          ADMIN_USERNAME: preview
          ADMIN_PASSWORD: preview

      - name: Capture static pages
        run: |
          BASE="${{ steps.urls.outputs.base_path }}"

          # Auto-detect pages from src/app/
          PAGES=("")
          for f in $(find src/app -name "page.tsx" -not -path "*/api/*" -not -path "*/admin/*" | sort); do
            route=$(dirname "$f" | sed 's|^src/app||' | sed 's|^/||')
            if [ -n "$route" ] && [ "$route" != "." ]; then
              PAGES+=("$route")
            fi
          done
          echo "Detected pages: ${PAGES[*]}"

          # Prepare standalone server
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          node .next/standalone/server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sL "http://localhost:3000${BASE}" > /dev/null 2>&1 && break
            sleep 1
          done

          # Download pages
          mkdir -p _site
          for page in "${PAGES[@]}"; do
            if [ -z "$page" ]; then
              curl -sL "http://localhost:3000${BASE}" -o _site/index.html
            else
              mkdir -p "_site/$page"
              curl -sL "http://localhost:3000${BASE}/$page" -o "_site/$page/index.html"
            fi
          done

          # Copy static assets
          mkdir -p "_site/_next"
          cp -r .next/static "_site/_next/static"
          cp -r public/* _site/ 2>/dev/null || true

          kill $SERVER_PID 2>/dev/null || true

          # 404.html redirect for client-side navigation
          cat > _site/404.html <<EOF
          <!DOCTYPE html><html><head><meta charset="utf-8"><title>Redirecting</title>
          <script>var b='${BASE}',p=location.pathname;if(!p.startsWith(b))location.replace(b+p+location.search+location.hash);</script>
          </head><body></body></html>
          EOF

          echo "Files: $(find _site -type f | wc -l), Size: $(du -sh _site | cut -f1)"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
