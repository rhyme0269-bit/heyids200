name: Deploy Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  BASE_PATH: /heyids200
  SITE_URL: https://rhyme0269-bit.github.io/heyids200

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app with basePath
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          ADMIN_USERNAME: preview
          ADMIN_PASSWORD: preview

      - name: Capture static pages
        run: |
          BASE="${{ env.BASE_PATH }}"
          PAGES=("" "about" "services" "tools" "faq" "contact")

          # Copy assets for standalone server
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

          # Start server
          node .next/standalone/server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sL "http://localhost:3000${BASE}" > /dev/null 2>&1 && break
            sleep 1
          done

          # Download pages as dir/index.html
          mkdir -p _site
          for page in "${PAGES[@]}"; do
            if [ -z "$page" ]; then
              curl -sL "http://localhost:3000${BASE}" -o _site/index.html
            else
              mkdir -p "_site/$page"
              curl -sL "http://localhost:3000${BASE}/$page" -o "_site/$page/index.html"
            fi
          done

          # Copy ALL static assets (CSS + JS)
          mkdir -p "_site/_next"
          cp -r .next/static "_site/_next/static"
          cp -r public/* _site/ 2>/dev/null || true

          kill $SERVER_PID 2>/dev/null || true

          # Create 404.html — redirects /about → /heyids200/about
          # This catches Next.js client-side navigation that misses basePath
          cat > _site/404.html << 'HEREDOC'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>Redirecting...</title>
          <script>
          (function(){
            var base = '/heyids200';
            var path = window.location.pathname;
            if (!path.startsWith(base)) {
              window.location.replace(base + path + window.location.search + window.location.hash);
            }
          })();
          </script>
          </head><body></body></html>
          HEREDOC

          echo "Files: $(find _site -type f | wc -l), Size: $(du -sh _site | cut -f1)"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
