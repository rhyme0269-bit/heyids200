name: Deploy Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  BASE_PATH: /heyids200
  SITE_URL: https://rhyme0269-bit.github.io/heyids200

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app with basePath
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          ADMIN_USERNAME: preview
          ADMIN_PASSWORD: preview

      - name: Capture static pages
        run: |
          BASE="${{ env.BASE_PATH }}"
          PAGES=("" "about" "services" "tools" "faq" "contact")

          # Copy assets for standalone server
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

          # Start server
          node .next/standalone/server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sL "http://localhost:3000${BASE}" > /dev/null 2>&1 && break
            sleep 1
          done

          # Download each page (-L follows redirects)
          mkdir -p _site
          for page in "${PAGES[@]}"; do
            if [ -z "$page" ]; then
              curl -sL "http://localhost:3000${BASE}" -o _site/index.html
            else
              mkdir -p "_site/$page"
              curl -sL "http://localhost:3000${BASE}/$page" -o "_site/$page/index.html"
            fi
          done

          # Copy static assets (basePath is baked into the build)
          mkdir -p "_site/_next"
          cp -r .next/static "_site/_next/static"
          cp -r public/* _site/ 2>/dev/null || true

          kill $SERVER_PID 2>/dev/null || true

          # Remove Next.js client-side JS router to prevent navigation hijacking.
          # Keep CSS chunks but strip JS bootstrap scripts from HTML.
          # This makes pages work as pure static HTML with correct href links.
          find _site -name "*.html" -exec sed -i \
            -e '/<script src="[^"]*chunks[^"]*\.js"/d' \
            -e '/<script>self\.__next/d' \
            {} \;

          # Keep only CSS files in _next/static, remove JS chunks
          find _site/_next/static/chunks -name "*.js" -delete 2>/dev/null || true

          echo "Files: $(find _site -type f | wc -l), Size: $(du -sh _site | cut -f1)"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
