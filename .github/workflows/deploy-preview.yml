name: Deploy Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://rhyme0269-bit.github.io/heyids200
          ADMIN_USERNAME: preview
          ADMIN_PASSWORD: preview

      - name: Start server and mirror site
        run: |
          # Copy static assets needed by standalone server
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

          # Start the production server
          node .next/standalone/server.js &
          SERVER_PID=$!

          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done

          # Use wget to mirror the entire site (HTML + CSS + JS + images)
          wget --mirror \
               --convert-links \
               --adjust-extension \
               --page-requisites \
               --no-parent \
               --no-host-directories \
               --directory-prefix=_site \
               --reject="admin*" \
               --timeout=10 \
               --tries=2 \
               http://localhost:3000/ \
               http://localhost:3000/about \
               http://localhost:3000/services \
               http://localhost:3000/tools \
               http://localhost:3000/faq \
               http://localhost:3000/contact \
               || true

          # Stop server
          kill $SERVER_PID 2>/dev/null || true

          # Show what was captured
          echo "=== Captured files ==="
          find _site -type f | head -50
          echo "Total files: $(find _site -type f | wc -l)"
          echo "Total size: $(du -sh _site | cut -f1)"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
