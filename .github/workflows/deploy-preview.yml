name: Deploy Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  BASE_PATH: /heyids200
  SITE_URL: https://rhyme0269-bit.github.io/heyids200

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          ADMIN_USERNAME: preview
          ADMIN_PASSWORD: preview

      - name: Start server and capture site
        run: |
          BASE="${{ env.BASE_PATH }}"
          PAGES=("" "about" "services" "tools" "faq" "contact")

          # Copy assets for standalone server
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

          # Start server
          node .next/standalone/server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -s http://localhost:3000 > /dev/null 2>&1 && break
            sleep 1
          done

          # Download each page as dir/index.html
          mkdir -p _site
          for page in "${PAGES[@]}"; do
            if [ -z "$page" ]; then
              curl -s http://localhost:3000/ -o _site/index.html
            else
              mkdir -p "_site/$page"
              curl -s "http://localhost:3000/$page" -o "_site/$page/index.html"
            fi
          done

          # Copy static assets
          mkdir -p _site/_next
          cp -r .next/static _site/_next/static
          cp -r public/* _site/ 2>/dev/null || true

          kill $SERVER_PID 2>/dev/null || true

          # Rewrite all internal paths to include basePath
          find _site -name "*.html" -exec sed -i \
            -e "s|\"/_next/|\"${BASE}/_next/|g" \
            -e "s|'/_next/|'${BASE}/_next/|g" \
            {} \;

          # Rewrite href links for all known pages
          for page in "${PAGES[@]}"; do
            if [ -z "$page" ]; then
              find _site -name "*.html" -exec sed -i "s|href=\"/\"|href=\"${BASE}/\"|g" {} \;
            else
              find _site -name "*.html" -exec sed -i "s|href=\"/${page}\"|href=\"${BASE}/${page}\"|g" {} \;
              find _site -name "*.html" -exec sed -i "s|href=\"/${page}#|href=\"${BASE}/${page}#|g" {} \;
            fi
          done

          echo "Files: $(find _site -type f | wc -l), Size: $(du -sh _site | cut -f1)"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
