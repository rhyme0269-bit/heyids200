services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://example.com}
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      # 直接掛載本機 data 資料夾，而非具名 volume：
      # 後台編輯的內容會落在 ./data/oneness.db，npm run publish 才讀得到，
      # 備份也只要複製這個資料夾即可。
      - ./data:/app/data
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      # 啟用 SSL 時，將憑證掛載進來：
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - app

